<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="fpgaFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c678dd" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#c678dd" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="flow" d="M 118 150 H 232 M 318 150 H 360 M 470 150 H 512 M 622 150 H 664 M 754 150 H 800"/>
  </defs>

  <rect width="900" height="300" rx="14" fill="url(#card)" stroke="#30363d" stroke-width="1"/>

  <text x="28" y="38" fill="#8b949e" font-size="12" letter-spacing="1.5">CAN SENSOR FUSION PLATFORM &#183; CYCLONE V SoC</text>
  <text x="28" y="58" fill="#484f58" font-size="10.5" letter-spacing="0.5">custom verilog IP &#183; no vendor cores &#183; no soft processor</text>

  <!-- ============ STAGE 1: STM32 ============ -->
  <g>
    <rect x="28" y="112" width="90" height="76" rx="8" fill="#e06c75" fill-opacity="0.12" stroke="#e06c75" stroke-width="1.2"/>
    <text x="73" y="140" fill="#e06c75" font-size="12.5" font-weight="600" text-anchor="middle">STM32F4</text>
    <text x="73" y="157" fill="#8b949e" font-size="9.5" text-anchor="middle">sensor node</text>
    <text x="73" y="172" fill="#484f58" font-size="9" text-anchor="middle">bare-metal C</text>
    <circle cx="110" cy="122" r="3" fill="#e06c75">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- CAN bus -->
  <line x1="118" y1="150" x2="232" y2="150" stroke="#30363d" stroke-width="2"/>
  <text x="175" y="140" fill="#98c379" font-size="10" text-anchor="middle" font-weight="600">CAN 2.0B</text>
  <text x="175" y="168" fill="#484f58" font-size="9" text-anchor="middle">500 kbps</text>

  <!-- ============ STAGE 2: FPGA FABRIC ============ -->
  <rect x="232" y="86" width="432" height="128" rx="10" fill="url(#fpgaFill)" stroke="#c678dd" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="448" y="106" fill="#c678dd" font-size="10.5" text-anchor="middle" letter-spacing="1.2">FPGA FABRIC &#183; VERILOG RTL</text>

  <g>
    <rect x="248" y="124" width="70" height="52" rx="6" fill="#0d1117" stroke="#c678dd" stroke-width="1"/>
    <text x="283" y="146" fill="#c9d1d9" font-size="10" text-anchor="middle">MCP2515</text>
    <text x="283" y="160" fill="#484f58" font-size="8.5" text-anchor="middle">SPI master</text>
  </g>
  <line x1="318" y1="150" x2="360" y2="150" stroke="#30363d" stroke-width="1.6"/>

  <g>
    <rect x="360" y="124" width="110" height="52" rx="6" fill="#0d1117" stroke="#c678dd" stroke-width="1"/>
    <text x="415" y="146" fill="#c9d1d9" font-size="10" text-anchor="middle">frame parser</text>
    <text x="415" y="160" fill="#484f58" font-size="8.5" text-anchor="middle">+ 1 &#181;s timestamp</text>
  </g>
  <line x1="470" y1="150" x2="512" y2="150" stroke="#30363d" stroke-width="1.6"/>

  <g>
    <rect x="512" y="124" width="110" height="52" rx="6" fill="#0d1117" stroke="#c678dd" stroke-width="1"/>
    <text x="567" y="145" fill="#c9d1d9" font-size="10" text-anchor="middle">8-tap FIR</text>
    <text x="567" y="159" fill="#484f58" font-size="8.5" text-anchor="middle">pipelined 16&#215;16</text>
    <!-- tap pulse -->
    <g fill="#c678dd">
      <rect x="524" y="168" width="6" height="3" rx="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0s"    repeatCount="indefinite"/></rect>
      <rect x="536" y="168" width="6" height="3" rx="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.15s" repeatCount="indefinite"/></rect>
      <rect x="548" y="168" width="6" height="3" rx="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.3s"  repeatCount="indefinite"/></rect>
      <rect x="560" y="168" width="6" height="3" rx="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.45s" repeatCount="indefinite"/></rect>
      <rect x="572" y="168" width="6" height="3" rx="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.6s"  repeatCount="indefinite"/></rect>
      <rect x="584" y="168" width="6" height="3" rx="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.75s" repeatCount="indefinite"/></rect>
      <rect x="596" y="168" width="6" height="3" rx="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.9s"  repeatCount="indefinite"/></rect>
      <rect x="608" y="168" width="6" height="3" rx="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="1.05s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <!-- ============ STAGE 3: AXI4-Lite ============ -->
  <line x1="622" y1="150" x2="664" y2="150" stroke="#30363d" stroke-width="1.6"/>
  <g>
    <rect x="664" y="118" width="90" height="64" rx="8" fill="#e5c07b" fill-opacity="0.1" stroke="#e5c07b" stroke-width="1.2"/>
    <text x="709" y="143" fill="#e5c07b" font-size="10.5" font-weight="600" text-anchor="middle">AXI4-Lite</text>
    <text x="709" y="158" fill="#484f58" font-size="8.5" text-anchor="middle">HPS bridge</text>
  </g>

  <!-- ============ STAGE 4: Cortex-A9 ============ -->
  <line x1="754" y1="150" x2="800" y2="150" stroke="#30363d" stroke-width="2"/>
  <g>
    <rect x="800" y="112" width="72" height="76" rx="8" fill="#61afef" fill-opacity="0.12" stroke="#61afef" stroke-width="1.2"/>
    <text x="836" y="140" fill="#61afef" font-size="11" font-weight="600" text-anchor="middle">Cortex-A9</text>
    <text x="836" y="156" fill="#8b949e" font-size="9" text-anchor="middle">Linux</text>
    <text x="836" y="171" fill="#484f58" font-size="8.5" text-anchor="middle">user-space C</text>
  </g>

  <!-- ============ ANIMATED DATA PACKETS ============ -->
  <g filter="url(#glow)">
    <circle r="4.5" fill="#98c379">
      <animateMotion dur="4.2s" repeatCount="indefinite"
        path="M 118 150 L 248 150 M 318 150 L 360 150 M 470 150 L 512 150 M 622 150 L 664 150 M 754 150 L 872 150"/>
      <animate attributeName="opacity" values="0;1;1;1;0" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="4.5" fill="#98c379">
      <animateMotion dur="4.2s" begin="1.4s" repeatCount="indefinite"
        path="M 118 150 L 248 150 M 318 150 L 360 150 M 470 150 L 512 150 M 622 150 L 664 150 M 754 150 L 872 150"/>
      <animate attributeName="opacity" values="0;1;1;1;0" dur="4.2s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="4.5" fill="#98c379">
      <animateMotion dur="4.2s" begin="2.8s" repeatCount="indefinite"
        path="M 118 150 L 248 150 M 318 150 L 360 150 M 470 150 L 512 150 M 622 150 L 664 150 M 754 150 L 872 150"/>
      <animate attributeName="opacity" values="0;1;1;1;0" dur="4.2s" begin="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============ FOOTER STATS ============ -->
  <g font-size="10">
    <text x="28" y="252" fill="#484f58">verified on</text>
    <text x="96" y="252" fill="#8b949e">DE1-SoC silicon</text>
    <text x="28" y="270" fill="#484f58">testbench</text>
    <text x="96" y="270" fill="#8b949e">per block, pre-integration</text>

    <text x="330" y="252" fill="#484f58">timing</text>
    <text x="382" y="252" fill="#8b949e">closed in Quartus</text>
    <text x="330" y="270" fill="#484f58">vendor IP</text>
    <text x="382" y="270" fill="#98c379">none</text>

    <text x="620" y="252" fill="#484f58">soft processor</text>
    <text x="712" y="252" fill="#98c379">none</text>
    <text x="620" y="270" fill="#484f58">bus interface</text>
    <text x="712" y="270" fill="#8b949e">written from scratch</text>
  </g>
</svg>
